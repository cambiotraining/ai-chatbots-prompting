name: Publish workshop interface
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm install --omit=dev --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run check
      - uses: actions/configure-pages@v6
      - name: Upload website artifact
        id: upload
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: public
          retention-days: 7
      - name: Verify website artifact was uploaded
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
        run: |
          if [ -z "$ARTIFACT_ID" ]; then
            echo "::error::The website artifact was not uploaded. Check the Upload website artifact step."
            exit 1
          fi
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages
